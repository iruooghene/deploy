name: Deployment to dev environment

on:
  push:
    branches: [in-dev]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Amazon ECR Repository URL (e.g. 357586184453.dkr.ecr.us-east-1.amazonaws.com/venture-cloud)"
        required: true
        type: string
      image_tag:
        description: "Docker Image Tag to deploy (e.g. 25-11-08)"
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  CONTAINER_PORT: 7070
  BLUE_PORT: 7070
  GREEN_PORT: 7071
  NGINX_PORT: 443
  SERVER_NAME: api-dev.myventurecloud.com
  NGINX_CONFIG_PATH: /etc/nginx/sites-available/myventurecloud.com
  CONTAINER_NAME_PREFIX: venturecloud-dev
  DEFAULT_REPO_URL: 357586184453.dkr.ecr.us-east-1.amazonaws.com/venture-cloud
  DEFAULT_IMAGE_TAG: latest

jobs:
  docker-build-and-push:
    runs-on: ubuntu-22.04

    env:
      REPO_URL: ${{ github.event.inputs.repo_url || env.DEFAULT_REPO_URL }}
      DATE_TAG: ${{ github.event.inputs.image_tag || env.DEFAULT_IMAGE_TAG }}

    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: docker build -t venture-cloud:$GITHUB_SHA -f Dockerfile .

      - name: Tag Docker image
        run: |
          DOCKER_TAG=${{ env.REPO_URL }}:${{ env.DATE_TAG }}
          docker tag venture-cloud:$GITHUB_SHA $DOCKER_TAG
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV

      - name: Push Docker image to Amazon ECR
        run: docker push $DOCKER_TAG

  deploy-to-dev:
    runs-on: ovh
    needs: docker-build-and-push

    env:
      REPO_URL: ${{ github.event.inputs.repo_url || env.DEFAULT_REPO_URL }}
      DATE_TAG: ${{ github.event.inputs.image_tag || env.DEFAULT_IMAGE_TAG }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate with Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ env.REPO_URL }}

      - name: Pull latest Docker image
        run: docker pull ${{ env.REPO_URL }}:${{ env.DATE_TAG }}

      - name: Download .env file from S3 (dev)
        run: |
          sudo mkdir -p /home/ubuntu/semicolon/venturecloud/dev
          sudo aws s3 cp s3://semicolon-delivery/venturecloud/dev/venturecloud-dev.env /home/ubuntu/semicolon/venturecloud/dev/venturecloud-dev.env --region eu-west-1
          sudo chown ubuntu:ubuntu /home/ubuntu/semicolon/venturecloud/dev/venturecloud-dev.env

      - name: Determine active environment
        id: active_env
        run: |
          if sudo docker ps --format '{{.Names}}' | grep -q "${CONTAINER_NAME_PREFIX}_blue"; then
            echo "ACTIVE_ENV=blue" >> $GITHUB_ENV
            echo "NEW_ENV=green" >> $GITHUB_ENV
            echo "NEW_PORT=${{ env.GREEN_PORT }}" >> $GITHUB_ENV
          else
            echo "ACTIVE_ENV=green" >> $GITHUB_ENV
            echo "NEW_ENV=blue" >> $GITHUB_ENV
            echo "NEW_PORT=${{ env.BLUE_PORT }}" >> $GITHUB_ENV
          fi

      - name: Clean up stopped conflicting container
        run: |
          if [ "$(docker ps -aq -f name=${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }} -f status=exited)" ]; then
            docker rm ${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }}
          fi
          if [ "$(docker ps -aq -f name=${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }} -f status=created)" ]; then
            docker rm ${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }}
          fi

      - name: Start new container
        run: |
          sudo docker run -d --env-file /home/ubuntu/semicolon/venturecloud/dev/venturecloud-dev.env \
            --name ${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }} -p ${{ env.NEW_PORT }}:${{ env.CONTAINER_PORT }} \
            --restart unless-stopped \
            ${{ env.REPO_URL }}:${{ env.DATE_TAG }}

      - name: Health check new container
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:${{ env.NEW_PORT }}/actuator/health | grep -q "UP"; then
              echo "New container is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed!"
          sudo docker stop ${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }}
          sudo docker rm ${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }}
          exit 1

      - name: Update Nginx configuration
        run: |
          sudo sed -i "/server_name ${{ env.SERVER_NAME }};/,/}/ s/proxy_pass http:\/\/localhost:[0-9]\+;/proxy_pass http:\/\/localhost:${{ env.NEW_PORT }};/" ${{ env.NGINX_CONFIG_PATH }}
          sudo nginx -t && sudo systemctl reload nginx || exit 1

      - name: Stop and remove old container
        run: |
          if [ "${{ env.ACTIVE_ENV }}" != "${{ env.NEW_ENV }}" ]; then
            sudo docker stop ${CONTAINER_NAME_PREFIX}_${{ env.ACTIVE_ENV }} || true
            sudo docker rm ${CONTAINER_NAME_PREFIX}_${{ env.ACTIVE_ENV }} || true
          fi

      - name: Confirm Deployment Success
        run: |
          if sudo docker ps --format '{{.Names}}' | grep -q "${CONTAINER_NAME_PREFIX}_${{ env.NEW_ENV }}"; then
            echo "✅ Blue-Green Deployment to dev successful!"
            exit 0
          else
            echo "❌ Deployment failed!"
            exit 1
          fi

      - name: Prune unused images
        run: sudo docker image prune -af
